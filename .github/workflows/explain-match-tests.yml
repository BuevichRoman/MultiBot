name: ExplainMatch template behavioral tests

on:
  pull_request:
    branches:
      - master
    paths:
      - 'server/script_templates/explain_match.php'
      - 'tests/explain-match-behavior.php'
      - '.github/workflows/explain-match-tests.yml'
  push:
    branches:
      - feat/explain-match-template
    paths:
      - 'server/script_templates/explain_match.php'
      - 'tests/explain-match-behavior.php'
      - '.github/workflows/explain-match-tests.yml'

jobs:
  behavioral-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
          coverage: none
      - name: Check PHP syntax
        run: php -l server/script_templates/explain_match.php
      - name: Run behavioral tests
        run: php tests/explain-match-behavior.php
