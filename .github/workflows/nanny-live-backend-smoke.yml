name: Nanny live backend smoke test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Check smoke-test script syntax
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check tests/live_backend_smoke.mjs

  live-backend-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    name: Read-only live API check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check live backend authentication, data access and nanny pricing
        env:
          MULTIBOT_API_URL: ${{ secrets.MULTIBOT_API_URL }}
          MULTIBOT_ADMIN_LOGIN: ${{ secrets.MULTIBOT_ADMIN_LOGIN }}
          MULTIBOT_ADMIN_PASSWORD: ${{ secrets.MULTIBOT_ADMIN_PASSWORD }}
        run: node tests/live_backend_smoke.mjs
